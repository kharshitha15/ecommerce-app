spring.application.name=emostore
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8081}

# JWT Settings
# Security: Removed hardcoded fallback to force fail-fast if JWT_SECRET is missing in environment
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# Razorpay Configuration
razorpay.api.key=${RAZORPAY_KEY:dummy_razorpay_key}
razorpay.api.secret=${RAZORPAY_SECRET:dummy_razorpay_secret}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dummy_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:dummy_cloudinary_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:dummy_cloudinary_secret}

# Default Database (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:emostoredb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

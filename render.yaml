databases:
  - name: emostore-db
    plan: free
    databaseName: emostoredb
    user: emostoreuser

services:
  - type: web
    name: emostore-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: emostore-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: emostore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: emostore-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://emostore-frontend.onrender.com

  - type: web
    name: emostore-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://emostore-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
